services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./runs:/app/runs"]
  dashboard:
    build: .
    env_file: .env
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    volumes: ["./runs:/app/runs"]
